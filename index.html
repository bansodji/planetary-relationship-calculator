<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Compound Relationship of Planets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <link rel="stylesheet" href="./css/main.css">
</head>

<body>

    <header class="my-3 container">
        <h2 class="text-center">Find Compound Relationship of Planets</h2>
    </header>

    <main>
        <form id="MainForm">
            <div class="container">
                <div class="my-3 row">
                    <div class="my-2 col-md-2 col-4">
                        <label for="sun">
                            Sun: <input required name="sun" id="sun" type="number" min="1" max="12" value="1" />
                        </label>
                    </div>

                    <div class="my-2 col-md-2 col-4">
                        <label for="moon">
                            Moon: <input required name="moon" id="moon" type="number" min="1" max="12" value="1" />
                        </label>
                    </div>

                    <div class="my-2 col-md-2 col-4">
                        <label for="mars">
                            Mars: <input required name="mars" id="mars" type="number" min="1" max="12" value="7" />
                        </label>
                    </div>

                    <div class="my-2 col-md-2 col-4">
                        <label for="mercury">
                            Mercury: <input required name="mercury" id="mercury" type="number" min="1" max="12"
                                value="12" />
                        </label>
                    </div>

                    <div class="my-2 col-md-2 col-4">
                        <label for="jupiter">
                            Jupiter: <input required name="jupiter" id="jupiter" type="number" min="1" max="12"
                                value="12" />
                        </label>
                    </div>

                    <div class="my-2 col-md-2 col-4">
                        <label for="venus">
                            Venus: <input required name="venus" id="venus" type="number" min="1" max="12" value="2" />
                        </label>
                    </div>

                    <div class="my-2 col-md-2 col-4">
                        <label for="saturn">
                            Saturn: <input required name="saturn" id="saturn" type="number" min="1" max="12"
                                value="1" />
                        </label>
                    </div>

                    <div class="my-2 col-md-2 col-4">
                        <label for="rahu">
                            Rahu: <input required name="rahu" id="rahu" type="number" min="1" max="12" value="4" />
                        </label>
                    </div>

                    <div class="my-2 col-md-2 col-4">
                        <label for="ketu">
                            Ketu: <input required name="ketu" id="ketu" type="number" min="1" max="12" value="10" />
                        </label>
                    </div>
                </div>

                <p class="my-2">Note: Enter rashi of each planets</p>
                <button class="btn btn-primary" type="submit">Submit</button>
                <button type="button" class="btn btn-secondary" id="ClearButton">Clear</button>
            </div>
        </form>

        <div class="container my-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="ShowTempRelationship">
                <label class="form-check-label" for="ShowTempRelationship">
                    Show Temporary Relationship
                </label>
            </div>
        </div>

        <section class="container my-3">
            <div id="TempRelationshipTable" class="table-responsive">

            </div>
        </section>
        <div class="py-2"></div>
        <section class="container my-3">
            <div id="CompRelationshipTable" class="table-responsive">

            </div>
        </section>

    </main>









    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

    <script src="./js/main.js"></script>
</body>

</html>
